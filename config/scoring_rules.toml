[display]
# Queued jobs scoring below this stay in the DB but are hidden from the TUI, sprint and counters.
min_score = 10.0

[resumes]
swe_backend = "resumes/swe_backend_v1.pdf"
data_eng = "resumes/data_eng_lakehouse_v1.pdf"
analytics_msba = "resumes/analytics_msba_v1.pdf"

[penalties]
points = 100.0
title_contains = [
  "staff", "principal", "director", "vp", "vice president",
  "senior", "sr", "sr.", "lead", "head of", "chief",
  "fellow", "distinguished", "supervisor", "supervisory",
  "iii", "iv", "v", "level 3", "level 4", "level 5",
  "l5", "l6", "l7", "ic4", "ic5", "ic6",
  "phd intern", "phd residency", "(phd)", "postdoc", "postdoctoral"
]
# Contextual title disqualifiers: penalized unless exempted by an early-career or recognized modifier
architect_exempt = ["associate", "junior", "intern", "new grad", "entry", "i", "1"]
manager_exempt = ["product manager", "program manager", "project manager", "account manager", "client manager"]

[disqualifiers]
penalty = 100.0
max_yoe = 4

# Non-target titles that should never be boosted into the queue
title_exclude = [
  "sales development", "business development", "sdr", "bdr",
  "account executive", "sales representative", "store associate",
  "retail associate", "warehouse associate", "warehouse", "delivery associate",
  "material handler", "forklift", "driver", "janitor", "custodian",
  "mechanic", "electrician", "hvac", "plumber", "carpenter",
  "nurse", "rn", "lpn", "physician", "therapist", "pharmacist",
  "dental", "veterinary", "security guard", "security officer",
  "cashier", "barista", "cook", "chef", "recruiter", "talent acquisition",
  "paralegal", "attorney", "counsel", "caregiver", "social worker"
]

# JD body phrases that trigger the -100.0 penalty
description_contains = [
  "ts/sci", "top secret", "polygraph", "ci poly", "full scope poly",
  "active secret clearance", "active dod secret", "security clearance required",
  "must hold an active", "q clearance", "l clearance",
  "phd required", "ph.d. required", "doctorate required", "must have a phd",
  "m.d. required", "j.d. required", "active rn license",
  "unpaid internship", "commission only", "100% commission",
  "corp-to-corp only", "c2c only"
]

[boosts]
points = 15.0
title_contains = ["intern", "new grad", "early career", "junior", "associate", "i", "1"]

# The job title picks the archetype first (checked in this order); keyword weights decide otherwise.
[title_archetype]
data_eng = [
  "data engineer", "analytics engineer", "etl", "data platform", "data infrastructure",
  "big data", "lakehouse", "dataops", "mlops", "database engineer", "data pipeline",
  "ai engineer", "ml engineer", "machine learning engineer", "data integration", "forward deployed"
]
analytics_msba = [
  "analyst", "analytics", "data scientist", "business intelligence", "bi engineer",
  "bi developer", "decision science", "business analyst", "quantitative", "quant",
  "product manager", "product analyst", "operations analyst", "bizops", "business operations",
  "revops", "revenue operations", "sales operations", "gtm operations", "solutions analyst",
  "growth analyst", "commercial analytics", "insights analyst", "financial analyst",
  "marketing analyst", "pricing analyst", "risk analyst", "research analyst", "economist",
  "statistician", "insights"
]
swe_backend = [
  "software", "sde", "swe", "backend", "back end", "full stack", "fullstack",
  "developer", "devops", "platform engineer", "site reliability", "sre",
  "systems engineer", "cloud engineer", "security engineer", "cybersecurity",
  "appsec", "solutions engineer", "solutions architect", "architect", "integration engineer", "automation engineer",
  "qa engineer", "test engineer", "application engineer"
]

[location]
primary_points = 10.0
primary = ["seattle", "bellevue", "redmond", "kirkland", "wa", "remote"]
secondary_points = 5.0
secondary = ["ca", "california", "oregon", "portland", "san francisco", "los angeles", "san diego", "san jose"]

# A keyword found in the title counts double.
[weights.data_eng]
duckdb = 4.0
polars = 4.0
dbt = 4.0
pyspark = 4.0
"delta lake" = 4.0
sql = 2.0
docker = 1.0

[weights.swe_backend]
fastapi = 4.0
rust = 3.0
go = 3.0
typescript = 3.0
docker = 2.0
sql = 1.0

[weights.analytics_msba]
"a/b" = 4.0
experimentation = 4.0
analytics = 3.0
sql = 2.0

[outreach]
template = """Hi — I just applied for the {title} role at {company} and wanted to reach out directly. \
My background is a strong fit for the work, and I'd welcome a quick 10-minute chat, \
or a pointer to the right person to talk to."""

[intel]
career_ops_root = "config/career_ops"
export_dir = "~/Documents/jobspy-cockpit"
evidence_dir = "config/evidence"
provider = "claude-cli"
model = "sonnet"
