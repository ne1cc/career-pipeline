projects:
  - id: "ab-testing-dagster"
    name: "Product A/B Testing & Experimentation Engine"
    repo: "https://github.com/ne1cc/ab-testing-dagster"
    role_tags: ["product_analyst", "data_scientist", "analytics_engineer", "decision_scientist", "growth_analyst"]
    domain_tags: ["product_analytics", "experimentation", "statistics", "data_pipeline"]
    primary_tools: ["Dagster", "dbt", "DuckDB", "Python", "SQL", "SciPy", "Statsmodels"]
    summary: "Production-grade experimentation engine that automates daily partition ingestion, transforms telemetry into analytics-ready marts, and applies CUPED variance reduction and sequential testing."
    completed_features:
      - "Implemented automated Sample Ratio Mismatch (SRM) guardrails using chi-square goodness-of-fit to halt metric computation if randomization fails."
      - "Built CUPED (Controlled-experiment Using Pre-Experiment Data) variance reduction algorithm cutting experiment sample size requirements and duration by ~40%."
      - "Designed dbt transformation marts computing conversion rate, average revenue per user (ARPU), and retention across treatment/control cohorts."
      - "Built Dagster software-defined asset graph orchestrating daily partition ingestion with automated data quality checks."
    verified_metrics:
      - "~40% variance reduction and experiment runtime savings via CUPED covariate adjustment."
      - "Zero false-positive experiment reads by enforcing automated SRM guardrails."
    interview_tradeoffs: "CUPED requires pre-experiment historical data; for brand new users without history, fallback is unadjusted Welch t-test. Chi-square SRM checks protect against silent traffic allocation skew."
    planned_not_completed: "Multi-armed bandit dynamic traffic reallocation algorithm."

