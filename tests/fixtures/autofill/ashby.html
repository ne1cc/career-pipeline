<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme - Software Engineer</title></head><body>
<!-- Trimmed from a live jobs.ashbyhq.com /application page (no <form> element there).
     The script is test scaffolding: it counts submits and imitates Ashby's yes/no buttons and location typeahead. -->
<h1>Software Engineer, Acme</h1>
<div class="ashby-application-form-autofill-input-root"><input type="file" tabindex="-1"><h3>Autofill from resume</h3><button>Upload file</button></div>
<div class="ashby-application-form-container">
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_name"><label class="ashby-application-form-question-title _heading_x _required_x" for="_systemfield_name">Legal Name</label><input placeholder="Type here..." name="_systemfield_name" required id="_systemfield_name" type="text" class="ashby-application-form-input-text" value=""></div>
<div class="ashby-application-form-field-entry" data-field-path="pref"><label class="ashby-application-form-question-title _heading_x" for="pref">Preferred Name (if applicable)</label><input placeholder="Type here..." name="pref"  id="pref" type="text" class="ashby-application-form-input-text" value=""></div>
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_email"><label class="ashby-application-form-question-title _heading_x _required_x" for="_systemfield_email">Email</label><input placeholder="hello@example.com..." name="_systemfield_email" required id="_systemfield_email" type="email" class="ashby-application-form-input-text" value=""></div>
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_resume"><label class="ashby-application-form-question-title _heading_x _required_x" for="_systemfield_resume">Resume</label><input type="file" id="_systemfield_resume" required><button>Upload File</button></div>
<div class="ashby-application-form-field-entry" data-field-path="phone"><label class="ashby-application-form-question-title _heading_x _required_x" for="phone">Phone Number</label><input placeholder="1-415-555-1234..." name="phone" required id="phone" type="tel" class="ashby-application-form-input-text" value=""></div>
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_location"><label class="ashby-application-form-question-title _heading_x _required_x" for="_systemfield_location">Where are you currently located?</label><div><input class="ashby-application-form-input-autocomplete" placeholder="Start typing..." aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" role="combobox" value=""><button></button></div></div>
<div class="ashby-application-form-field-entry" data-field-path="start"><label class="ashby-application-form-question-title _heading_x _required_x" for="start">When can you start a new role?</label><div><input type="text" placeholder="Pick date..." class="ashby-application-form-input-date" required value=""></div></div>
<div class="ashby-application-form-field-entry" data-field-path="auth"><label class="ashby-application-form-question-title _heading_x _required_x" for="auth">Are you authorized to work in the country where the job is located?</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="auth"></div></div>
<div class="ashby-application-form-field-entry" data-field-path="spons"><label class="ashby-application-form-question-title _heading_x _required_x" for="spons">Will you now or in the future require sponsorship for employment visa status in this country?</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="spons"></div></div>
<div class="ashby-application-form-field-entry" data-field-path="office"><label class="ashby-application-form-question-title _heading_x _required_x" for="office">Are you able to work from our US office three days per week?</label><div class="ashby-application-form-input-yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="office"></div></div>
<div class="ashby-application-form-field-entry" data-field-path="cover"><label class="ashby-application-form-question-title _heading_x" for="cover">Cover Letter</label><textarea placeholder="Type here..." name="cover" id="cover" class="ashby-application-form-input-textarea"></textarea></div>
<div class="ashby-application-form-field-entry" data-field-path="extra"><label class="ashby-application-form-question-title _heading_x" for="extra">Additional Information</label><textarea placeholder="Type here..." name="extra" id="extra" class="ashby-application-form-input-textarea"></textarea></div>
<div class="ashby-application-form-field-entry" data-field-path="arb"><label class="ashby-application-form-question-title _heading_x _required_x" for="arb">Applicant Arbitration Agreement Acknowledgement</label><fieldset><div><input type="checkbox" id="arb-c0" name="I acknowledge that I have read the Arbitration Agreement."><label for="arb-c0" class="ashby-application-form-input-checkbox-label">I acknowledge that I have read the Arbitration Agreement.</label></div></fieldset></div>
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_eeoc_gender"><label class="ashby-application-form-question-title _heading_x" for="_systemfield_eeoc_gender">Gender</label><fieldset class="ashby-application-form-input-radio-group"><div><input type="radio" id="gender-r0" name="gender" class="ashby-application-form-input-radio-group-option-radio"><label for="gender-r0" class="ashby-application-form-input-radio-group-option-label">Male</label></div><div><input type="radio" id="gender-r1" name="gender" class="ashby-application-form-input-radio-group-option-radio"><label for="gender-r1" class="ashby-application-form-input-radio-group-option-label">Female</label></div><div><input type="radio" id="gender-r2" name="gender" class="ashby-application-form-input-radio-group-option-radio"><label for="gender-r2" class="ashby-application-form-input-radio-group-option-label">Decline to self-identify</label></div></fieldset></div>
</div><button class="ashby-application-form-submit-button"><span>Submit Application</span></button>
<script>
window.__submits=0;
document.addEventListener('click',e=>{if(e.target.closest('.ashby-application-form-submit-button,[type=submit]'))window.__submits++},true);
document.addEventListener('submit',e=>{window.__submits++;e.preventDefault()},true);
document.querySelector('.ashby-application-form-input-date').addEventListener('blur',e=>{if(!/^\d\d\/\d\d\/\d{4}$/.test(e.target.value))e.target.value=''});
document.querySelectorAll('.ashby-application-form-input-yesno').forEach(g=>g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))})));
const loc=document.querySelector('[role=combobox]'),PLACES=['Seattle, Washington, United States','Seattle Heights, Texas, United States','Portland, Oregon, United States'];
loc.addEventListener('input',()=>{document.getElementById('menu')?.remove();const q=loc.value.toLowerCase();if(!q)return;
 const m=document.createElement('div');m.id='menu';m.setAttribute('role','listbox');
 PLACES.filter(p=>p.toLowerCase().includes(q.split(',')[0])).forEach(p=>{const o=document.createElement('div');o.setAttribute('role','option');o.textContent=p;o.onclick=()=>{loc.value=p;m.remove()};m.appendChild(o)});
 loc.parentElement.appendChild(m)});
</script></body></html>
