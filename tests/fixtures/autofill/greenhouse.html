<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Job Application for Software Engineer at Acme</title></head><body>
<!-- Trimmed from a live job-boards.greenhouse.io form (React Select comboboxes, intl-tel phone).
     The script below is test scaffolding: it counts submits and imitates React Select's menu. -->
<h1>Software Engineer, Acme</h1>
<form id="application-form" class="application--form"><div class="application--questions">
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="first_name-label" for="first_name" class="label">First Name<span aria-hidden="true">*</span></label><input id="first_name" class="input" aria-label="First Name" aria-required="true" type="text" autocomplete="given-name" value=""></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="last_name-label" for="last_name" class="label">Last Name<span aria-hidden="true">*</span></label><input id="last_name" class="input" aria-label="Last Name" aria-required="true" type="text" autocomplete="family-name" value=""></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="email-label" for="email" class="label">Email<span aria-hidden="true">*</span></label><input id="email" class="input" aria-label="Email" aria-required="true" type="text" autocomplete="email" value=""></div></div></div>
<div class="field-wrapper"><fieldset class="phone-input"><legend class="visually-hidden">Phone</legend>
 <div class="select__container"><label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label>
  <div class="select-shell" data-options="United States|Canada"><div><div class="select__control"><input class="select__input" autocomplete="off" id="country" type="text" aria-haspopup="true" aria-labelledby="country-label" aria-required="true" role="combobox" value=""></div></div><input required tabindex="-1" aria-hidden="true" value=""></div></div>
 <div class="text-input-wrapper"><label id="phone-label" for="phone" class="label">Phone<span aria-hidden="true">*</span></label><div class="iti"><button type="button" class="iti__selected-country" aria-label="Select country" aria-haspopup="dialog"></button><input id="iti-0__search-input" type="search" role="combobox" aria-label="Search" placeholder="Search"></div><input id="phone" class="input" aria-label="Phone" aria-required="true" type="tel" value="" autocomplete="off"></div>
</fieldset></div>
<div class="field-wrapper"><div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload"><div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div><button type="button" class="btn">Attach</button><label class="visually-hidden" for="resume">Attach</label><input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"><button type="button" class="btn" data-testid="resume-text">Enter manually</button></div></div>
<div class="field-wrapper"><div role="group" aria-labelledby="upload-label-cover_letter" class="file-upload"><div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div><button type="button" class="btn">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label><input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="q1-label" for="q1" class="label">LinkedIn Profile</label><input id="q1" class="input" aria-label="LinkedIn Profile" aria-required="false" type="text" value=""></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="q2-label" for="q2" class="label">Current Company</label><input id="q2" class="input" aria-label="Current Company" aria-required="false" type="text" value=""></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="q3-label" for="q3" class="label">Preferred Name<span aria-hidden="true">*</span></label><input id="q3" class="input" aria-label="Preferred Name" aria-required="true" type="text" value=""></div></div></div>
<div class="field-wrapper"><div class="select"><div class="select__container"><label id="q4-label" for="q4" class="label select__label">Are you legally authorized to work in the United States?<span aria-hidden="true">*</span></label><div class="select-shell" data-options="Yes|No"><div><div class="select__control"><input class="select__input" autocomplete="off" id="q4" type="text" aria-haspopup="true" aria-labelledby="q4-label" aria-required="true" role="combobox" value=""></div></div><input required tabindex="-1" aria-hidden="true" value=""></div></div></div></div>
<div class="field-wrapper"><div class="select"><div class="select__container"><label id="q5-label" for="q5" class="label select__label">Do you now, or will you in the future, require immigration sponsorship to work for Acme?<span aria-hidden="true">*</span></label><div class="select-shell" data-options="Yes|No"><div><div class="select__control"><input class="select__input" autocomplete="off" id="q5" type="text" aria-haspopup="true" aria-labelledby="q5-label" aria-required="true" role="combobox" value=""></div></div><input required tabindex="-1" aria-hidden="true" value=""></div></div></div></div>
<div class="field-wrapper"><div class="select"><div class="select__container"><label id="q6-label" for="q6" class="label select__label">How did you first learn about Acme as an employer?<span aria-hidden="true">*</span></label><div class="select-shell" data-options="Company website|LinkedIn|Job board|Referral"><div><div class="select__control"><input class="select__input" autocomplete="off" id="q6" type="text" aria-haspopup="true" aria-labelledby="q6-label" aria-required="true" role="combobox" value=""></div></div><input required tabindex="-1" aria-hidden="true" value=""></div></div></div></div>
<div class="field-wrapper"><div class="select"><div class="select__container"><label id="q7-label" for="q7" class="label select__label">Are you willing to relocate?</label><div class="select-shell" data-options="Yes, within the US|Yes, anywhere|No"><div><div class="select__control"><input class="select__input" autocomplete="off" id="q7" type="text" aria-haspopup="true" aria-labelledby="q7-label" aria-required="false" role="combobox" value=""></div></div></div></div></div></div>
<div class="field-wrapper"><div class="select"><div class="select__container"><label id="q8-label" for="q8" class="label select__label">Have you previously been employed at Acme for any length of time?<span aria-hidden="true">*</span></label><div class="select-shell" data-options="Yes|No"><div><div class="select__control"><input class="select__input" autocomplete="off" id="q8" type="text" aria-haspopup="true" aria-labelledby="q8-label" aria-required="true" role="combobox" value=""></div></div><input required tabindex="-1" aria-hidden="true" value=""></div></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="q9-label" for="q9" class="label">GitHub</label><input id="q9" class="input" aria-label="GitHub" aria-required="false" type="text" value=""></div></div></div>
<div class="field-wrapper"><div class="text-input-wrapper"><div class="input-wrapper"><label id="q10-label" for="q10" class="label">Portfolio</label><input id="q10" class="input" aria-label="Portfolio" aria-required="false" type="text" value=""></div></div></div>
<div class="field-wrapper field-wrapper--multiline"><div class="text-input-wrapper"><div class="input-wrapper"><label id="q11-label" for="q11" class="label">Why Acme?<span aria-hidden="true">*</span></label><textarea id="q11" class="input" aria-label="Why Acme?" aria-required="true" rows="4"></textarea></div></div></div>
</div><button type="submit" class="btn btn--pill">Submit application</button></form>
<script>
window.__submits=0;
document.addEventListener('click',e=>{if(e.target.closest('[type=submit]'))window.__submits++},true);
document.addEventListener('submit',e=>{window.__submits++;e.preventDefault()},true);
document.querySelectorAll('.select-shell').forEach(sh=>{const inp=sh.querySelector('input[role=combobox]');
 inp.addEventListener('click',()=>{if(sh.querySelector('[role=listbox]'))return;
  const lb=document.createElement('div');lb.setAttribute('role','listbox');lb.id=inp.id+'-lb';inp.setAttribute('aria-controls',lb.id);
  sh.dataset.options.split('|').forEach(t=>{const o=document.createElement('div');o.setAttribute('role','option');o.textContent=t;
   o.onclick=()=>{let v=sh.querySelector('.select__single-value');if(!v){v=document.createElement('div');v.className='select__single-value';sh.prepend(v)}v.textContent=t;lb.remove()};lb.appendChild(o)});
  sh.appendChild(lb)});
 inp.addEventListener('keydown',e=>{if(e.key==='Escape')sh.querySelector('[role=listbox]')?.remove()})});
</script></body></html>
