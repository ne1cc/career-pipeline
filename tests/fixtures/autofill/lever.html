<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme - Software Engineer</title></head><body>
<!-- Trimmed from a live jobs.lever.co /apply form. The script only counts submits. -->
<form id="application-form" method="POST" action="#"><ul>
<li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><span class="resume-upload-working" style="display:none">Analyzing resume...</span><input class="application-file-input" id="resume-upload-input" name="resume" type="file"></div></label></li>
<li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
<li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input name="email" type="email" required></div></label></li>
<li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
<li class="application-question"><label><div class="application-label">Current location</div><div class="application-field"><input class="location-input" id="location-input" type="text" name="location"><input id="selected-location" type="hidden" name="selectedLocation"></div></label></li>
<li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
<li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
<li class="application-question"><label><div class="application-label">Twitter URL</div><div class="application-field"><input type="text" name="urls[Twitter]"></div></label></li>
<li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
<li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
<li class="application-question"><label><div class="application-label">Other website</div><div class="application-field"><input type="text" name="urls[Other]"></div></label></li>
<li class="application-question custom-question"><div><div class="application-label full-width multiple-choice"><div class="text">Are you authorized to work in the United States?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><ul data-qa="multiple-choice"><li><label><input type="radio" name="cards[a][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li><li><label><input type="radio" name="cards[a][field0]" value="No" required><span class="application-answer-alternative">No</span></label></li></ul></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width multiple-choice"><div class="text">Will you require sponsorship for employment now or in the future?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><ul data-qa="multiple-choice"><li><label><input type="radio" name="cards[a][field1]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li><li><label><input type="radio" name="cards[a][field1]" value="No" required><span class="application-answer-alternative">No</span></label></li></ul></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width textarea"><div class="text">If yes, what type of sponsorship?</div></div><div class="application-field full-width"><textarea class="card-field-input" name="cards[a][field2]"></textarea></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width text"><div class="text">Please state your full legal name<span class="required">✱</span></div></div><div class="application-field full-width required-field"><input required class="card-field-input" type="text" placeholder="Type your response" name="cards[b][field0]"></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width multiple-choice"><div class="text">How did you hear about us?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><ul data-qa="multiple-choice"><li><label><input type="radio" name="cards[c][field0]" value="Campus visit" required><span class="application-answer-alternative">Campus visit</span></label></li><li><label><input type="radio" name="cards[c][field0]" value="LinkedIn Post" required><span class="application-answer-alternative">LinkedIn Post</span></label></li><li><label><input type="radio" name="cards[c][field0]" value="Other" required><span class="application-answer-alternative">Other</span></label></li></ul></div></div></li>
<li class="application-question custom-question"><div><div class="application-label full-width text"><div class="text">Why Acme?<span class="required">✱</span></div></div><div class="application-field full-width required-field"><input required class="card-field-input" type="text" name="cards[d][field0]"></div></div></li>
<li class="application-question"><label><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments"></textarea></div></label></li>
</ul><button id="btn-submit" type="submit" class="template-btn-submit">Submit application</button></form>
<script>window.__submits=0;document.addEventListener('click',e=>{if(e.target.closest('[type=submit]'))window.__submits++},true);document.addEventListener('submit',e=>{window.__submits++;e.preventDefault()},true);</script>
</body></html>
