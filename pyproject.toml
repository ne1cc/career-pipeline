[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "python-jobspy"
version = "1.1.82"
description = "Job scraper for LinkedIn, Indeed, Glassdoor, ZipRecruiter & Bayt"
authors = ["Cullen Watson <cullen@cullenwatson.com>", "Zachary Hampton <zachary@zacharysproducts.com>"]
homepage = "https://github.com/cullenwatson/JobSpy"
readme = "README.md"
keywords = [ "jobs-scraper", "linkedin", "indeed", "glassdoor", "ziprecruiter", "bayt", "naukri"]
[[tool.poetry.packages]]
include = "jobspy"
[[tool.poetry.packages]]
include = "cockpit"

[tool.poetry.scripts]
cockpit = "cockpit.cli:app"

[tool.black]
line-length = 88

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
pandas = "^2.1.0"
numpy = ">=1.26.0"
pydantic = "^2.3.0"
tls-client = "^1.0.1"
markdownify = "^1.1.0"
regex = "^2024.4.28"
gspread = "^6.2.1"
openpyxl = "^3.1.5"
google-api-python-client = "^2.198.0"
ats-scrapers = {version = ">=0.2.0", extras = ["scrapers"]}
duckdb = ">=1.1.0,<2.0.0"
polars = ">=1.0.0"
pyarrow = ">=16.0.0"
textual = ">=0.80.0"
typer = ">=0.12.0"
rich = ">=13.7.0"
google-genai = ">=0.1.0"
python-docx = ">=1.1.0"
pyyaml = ">=6.0.0"
playwright = ">=1.40.0"
pypdf = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
black = "*"
pre-commit = "*"
pytest = "^9.1.1"

[tool.pytest.ini_options]
pythonpath = ["."]

